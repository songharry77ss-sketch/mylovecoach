name: 텔레그램 알림 시험

# 운영 서버(Vercel)가 텔레그램으로 알림을 보낼 수 있는지 확인한다 — api/daily-report.ts ?test=1
# 11-21~27 서버의 텔레그램 값이 옛것이라 가입 알림이 조용히 끊겼던 일 뒤에 추가 (값은 배포 때 vercel.yml 이 맞춘다).
# 1) 서버로 시험 + 예시 가입·결제 알림 + 어제 리포트  2) 서버가 실패하면 GitHub 에서 바로 보내 대화방·봇은 살아 있는지 구분

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 운영 서버에서 보내기
        env:
          API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          base="${API_URL%/}"; base="${base%/api}"
          code=$(curl -sS -o out.json -w "%{http_code}" "$base/api/daily-report?test=1" -H "Authorization: Bearer $TG_TOKEN" || echo 000)
          echo "서버 응답: $code $(cat out.json 2>/dev/null)"
          if [ "$code" != "200" ] || ! grep -q '"sent":true' out.json; then
            echo "::error::운영 서버가 텔레그램을 보내지 못했어요 ($code) — 서버의 TELEGRAM_ 값이 GitHub 과 다르면 Vercel Deploy 를 다시 돌리세요"
            for id in ${TG_CHAT//,/ }; do
              curl -sS -o /dev/null "https://api.telegram.org/bot$TG_TOKEN/sendMessage" --data-urlencode "chat_id=$id" \
                --data-urlencode "text=⚠️ 센딧 알림 시험: 운영 서버가 보내지 못해 GitHub 에서 대신 보냈어요 (서버 응답 $code). 서버 텔레그램 값을 확인해야 해요." || true
            done
            exit 1
          fi
