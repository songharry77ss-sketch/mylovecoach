name: Android AAB

# 수동 실행: gh workflow run android.yml -f track=internal
# 필요한 시크릿: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# 선택: PLAY_SERVICE_ACCOUNT_JSON (있고 track 을 지정하면 Play Console 트랙에 바로 업로드)
# 변수(선택): EXPO_PUBLIC_API_URL
# 주의: Play Console 에 새 앱을 만든 뒤 **첫 AAB 는 콘솔에서 수동 업로드**해야 API 업로드가 열린다.
#       그 전에는 track 을 비워 두고 산출물(AAB)만 받아서 콘솔에 올린다.

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play 트랙 (비우면 업로드 없이 AAB 산출물만)'
        required: false
        default: ''
        type: choice
        options: ['', 'internal', 'alpha', 'beta', 'production']
      version_code:
        description: 'versionCode (비우면 100 + 실행 번호)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_API_TOKEN: ${{ secrets.EXPO_PUBLIC_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Gradle/네이티브 빌드 캐시 — 두 번째 실행부터 빌드 시간이 크게 줄어든다
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      # ubuntu-latest 러너에는 Android SDK 가 이미 설치돼 있다 (ANDROID_HOME 설정됨). 부족한 플랫폼/빌드툴은 Gradle 이 받는다.
      - name: Android SDK 확인
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | head -20
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: 시크릿 확인
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            if [ -n "${{ inputs.track }}" ]; then echo "::error::업로드 키 시크릿이 없어 Play 업로드용 빌드를 만들 수 없습니다 (tools/set-ci-secrets.mjs)"; exit 1; fi
            echo "::warning::업로드 키 시크릿이 없어 디버그 서명으로 검사 빌드만 만듭니다 (스토어 업로드 불가)"
            echo "SIGNING=debug" >> "$GITHUB_ENV"
          else
            echo "SIGNING=release" >> "$GITHUB_ENV"
          fi
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then echo "::warning::EXPO_PUBLIC_API_URL 변수가 비어 있어 앱이 개인 API 키 모드로만 동작합니다"; fi
      - run: npm ci
      - name: 네이티브 프로젝트 생성 (expo prebuild)
        run: npx expo prebuild --platform android --no-install
      - name: 서명 키 복원 + build.gradle 주입
        if: env.SIGNING == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$RUNNER_TEMP/upload.jks"
          code="${VERSION_CODE_INPUT:-$((100 + GITHUB_RUN_NUMBER))}"
          echo "ANDROID_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ANDROID_VERSION_CODE="$code" node tools/android-signing.mjs
      - name: versionCode 설정 (검사 빌드)
        if: env.SIGNING == 'debug'
        run: |
          code="${{ inputs.version_code }}"; code="${code:-$((100 + GITHUB_RUN_NUMBER))}"
          echo "ANDROID_VERSION_CODE=$code" >> "$GITHUB_ENV"
          sed -i "s/versionCode [0-9]*/versionCode $code/" android/app/build.gradle
      - name: Gradle 빌드 옵션
        run: |
          # 러너 메모리에 맞춘 JVM 힙. 검사 빌드(서명 없음)는 arm64 한 종류만 컴파일해 시간을 줄인다.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
          if [ "$SIGNING" = "debug" ]; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          fi
          grep -E "^(org.gradle.jvmargs|reactNativeArchitectures|newArchEnabled|hermesEnabled)=" android/gradle.properties
      - name: AAB 빌드
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android && ./gradlew bundleRelease --no-daemon --console=plain
          ls -la app/build/outputs/bundle/release/
      - name: 서명 확인 (디버그 키로 서명된 AAB 는 스토어에서 거부됨)
        if: env.SIGNING == 'release'
        run: |
          owner=$(keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -m1 -i -E "owner|소유자")
          echo "$owner"
          if echo "$owner" | grep -q "Android Debug"; then echo "::error::AAB 가 디버그 키로 서명됐습니다 (tools/android-signing.mjs 의 주입 실패)"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: mylovecoach-android-${{ env.ANDROID_VERSION_CODE }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
      - name: Play Console 업로드
        if: ${{ inputs.track != '' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "::error::PLAY_SERVICE_ACCOUNT_JSON 시크릿이 없어 업로드를 건너뜁니다"; exit 1; fi
          umask 077; printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-sa.json"
          echo "PLAY_SA_PATH=$RUNNER_TEMP/play-sa.json" >> "$GITHUB_ENV"
      - uses: r0adkll/upload-google-play@v1
        if: ${{ inputs.track != '' }}
        with:
          serviceAccountJson: ${{ env.PLAY_SA_PATH }}
          packageName: app.mylovecoach.android
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed
      - name: 정리
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play-sa.json"
