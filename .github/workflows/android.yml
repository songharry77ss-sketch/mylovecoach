name: Android AAB

# 수동 실행: gh workflow run android.yml --ref claude/jolly-pascal-tr47bw -f track=internal -f floating_bubble=false
#   -f floating_bubble=false 는 늘 적는다. 이 입력이 없는 예전 워크플로(버블 제외·매니페스트 검사 전)가 원격에 남아 있으면
#   GitHub 이 「Unexpected inputs provided」(HTTP 422)로 실행 자체를 거부해, 버블이 든 AAB 가 검사 없이 올라가지 않는다
#   (422 는 공식 문서에 없는 GitHub 동작). 실행 전 확인: gh workflow view android.yml --ref claude/jolly-pascal-tr47bw --yaml | grep floating_bubble
# 플로팅 버블은 기본으로 뺀다 — 버블은 포그라운드 서비스(specialUse)·「다른 앱 위에 표시」를 써서 Play Console 신고(설명·시연 영상)가 먼저 필요하다.
#   신고를 낸 뒤에만 -f floating_bubble=true. 직접 설치 APK(android-apk.yml)는 버블을 그대로 넣는다.
# 필요한 시크릿: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# 선택: PLAY_SERVICE_ACCOUNT_JSON (있고 track 을 지정하면 Play Console 트랙에 바로 업로드)
# 변수(필수): EXPO_PUBLIC_API_URL — 코치 서버 주소. 없으면 AI 답변 신고가 없는 빌드라 실패시킨다 (Play 생성형 AI 정책)
# 주의: Play Console 에 새 앱을 만든 뒤 **첫 AAB 는 콘솔에서 수동 업로드**해야 API 업로드가 열린다.
#       그 전에는 track 을 비워 두고 산출물(AAB)만 받아서 콘솔에 올린다.

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play 트랙 (비우면 업로드 없이 AAB 산출물만)'
        required: false
        default: ''
        type: choice
        options: ['', 'internal', 'alpha', 'beta', 'production']
      version_code:
        description: 'versionCode (비우면 100 + 실행 번호)'
        required: false
        type: string
      floating_bubble:
        description: '플로팅 버블 넣기 (Play 포그라운드 서비스 신고·시연 영상을 낸 뒤에만 켤 것)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_API_TOKEN: ${{ secrets.EXPO_PUBLIC_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Gradle/네이티브 빌드 캐시 — 두 번째 실행부터 빌드 시간이 크게 줄어든다
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      # ubuntu-latest 러너에는 Android SDK 가 이미 설치돼 있다 (ANDROID_HOME 설정됨). 부족한 플랫폼/빌드툴은 Gradle 이 받는다.
      - name: Android SDK 확인
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | head -20
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: 시크릿 확인
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            if [ -n "${{ inputs.track }}" ]; then echo "::error::업로드 키 시크릿이 없어 Play 업로드용 빌드를 만들 수 없습니다 (tools/set-ci-secrets.mjs)"; exit 1; fi
            echo "::warning::업로드 키 시크릿이 없어 디버그 서명으로 검사 빌드만 만듭니다 (스토어 업로드 불가)"
            echo "SIGNING=debug" >> "$GITHUB_ENV"
          else
            echo "SIGNING=release" >> "$GITHUB_ENV"
          fi
          # 서버 주소가 없으면 앱이 개인 API 키로만 AI 를 부르고 AI 답변 신고 진입점이 모두 숨는다 → Play 생성형 AI 정책(앱 안 신고)을 못 지키는 빌드
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then echo "::error::EXPO_PUBLIC_API_URL 변수가 비어 있어 코치 서버·AI 답변 신고가 없는 빌드가 됩니다 (node tools/set-ci-secrets.mjs --api-url …)"; exit 1; fi
      - run: npm ci
      # 저장소 파일은 그대로 두고 이 CI 사본에서만 바꾼다
      # ① 로컬 모듈 modules/floating-bubble 을 autolinking 에서 뺀다 (package.json 이 없어 폴더 이름으로 찾는다)
      #    → JS 의 requireOptionalNativeModule 이 null 이라 마이 탭은 자동으로 「빠른 코칭」 줄로 바뀐다
      # ② 프리빌드 기본 템플릿이 넣는 SYSTEM_ALERT_WINDOW 를 다시 막는다 (113 때와 같은 상태)
      - name: 플로팅 버블 빼기 (스토어 빌드 기본)
        if: ${{ !inputs.floating_bubble }}
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.expo = pkg.expo || {};
          pkg.expo.autolinking = pkg.expo.autolinking || {};
          const android = pkg.expo.autolinking.android || {};
          // autolinking 은 플랫폼 설정이 최상위 설정을 덮어쓴다(include 만 합침) → 최상위 exclude 도 함께 옮겨 적어야 그 모듈이 다시 연결되지 않는다
          android.exclude = [...new Set([...(pkg.expo.autolinking.exclude || []), ...(android.exclude || []), 'floating-bubble'])];
          pkg.expo.autolinking.android = android;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const blocked = new Set(app.expo.android.blockedPermissions || []);
          blocked.add('android.permission.SYSTEM_ALERT_WINDOW');
          app.expo.android.blockedPermissions = [...blocked];
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          console.log('autolinking:', JSON.stringify(pkg.expo.autolinking));
          console.log('blockedPermissions:', JSON.stringify(app.expo.android.blockedPermissions));
          EOF
          # Gradle 과 같은 방식으로 불러 확인한다. 명령이 실패하면 set -e 로 바로 멈추고(빈 출력으로 통과하지 않게),
          # 모듈 이름이 바뀌어도 잡히게 클래스 이름(expo.modules.floatingbubble.…)으로도 찾는다
          out=$(node --no-warnings --eval "require('expo/bin/autolinking')" expo-modules-autolinking resolve --platform android --json)
          n=$(printf '%s' "$out" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).modules.length))")
          if [ "$n" -lt 10 ] || grep -q -e floatingbubble -e floating-bubble <<<"$out"; then
            echo "::error::autolinking 확인 실패 — floating-bubble 이 남았거나 결과가 이상합니다 (모듈 ${n}개)"; exit 1
          fi
          echo "floating-bubble 을 autolinking 에서 뺐습니다 (모듈 ${n}개)"
      - name: 네이티브 프로젝트 생성 (expo prebuild)
        run: npx expo prebuild --platform android --no-install
      - name: 서명 키 복원 + build.gradle 주입
        if: env.SIGNING == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$RUNNER_TEMP/upload.jks"
          code="${VERSION_CODE_INPUT:-$((100 + GITHUB_RUN_NUMBER))}"
          echo "ANDROID_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ANDROID_VERSION_CODE="$code" node tools/android-signing.mjs
      - name: versionCode 설정 (검사 빌드)
        if: env.SIGNING == 'debug'
        run: |
          code="${{ inputs.version_code }}"; code="${code:-$((100 + GITHUB_RUN_NUMBER))}"
          echo "ANDROID_VERSION_CODE=$code" >> "$GITHUB_ENV"
          sed -i "s/versionCode [0-9]*/versionCode $code/" android/app/build.gradle
      - name: Gradle 빌드 옵션
        run: |
          # 러너 메모리에 맞춘 JVM 힙. 검사 빌드(서명 없음)는 arm64 한 종류만 컴파일해 시간을 줄인다.
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g/' android/gradle.properties
          if [ "$SIGNING" = "debug" ]; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          fi
          grep -E "^(org.gradle.jvmargs|reactNativeArchitectures|newArchEnabled|hermesEnabled)=" android/gradle.properties
      - name: AAB 빌드
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android && ./gradlew bundleRelease --no-daemon --console=plain
          ls -la app/build/outputs/bundle/release/
      # 버블을 뺀 빌드에 포그라운드 서비스·다른 앱 위 표시가 하나라도 남으면 Play 에 올리지 않는다 (신고 전이라 검토가 막힘)
      - name: 매니페스트 확인 (병합 매니페스트·AAB — 포그라운드 서비스·SYSTEM_ALERT_WINDOW 없음)
        if: ${{ !inputs.floating_bubble }}
        run: |
          set -euo pipefail
          m=android/app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          if [ ! -f "$m" ]; then
            # AGP 판에 따라 경로가 다를 수 있어 릴리스 병합 매니페스트를 찾는다
            m=$(find android/app/build/intermediates -type f -name AndroidManifest.xml -path '*merged_manifest*' -path '*release*' | head -1)
          fi
          if [ -z "$m" ] || [ ! -f "$m" ]; then
            echo "::error::병합된 릴리스 매니페스트를 찾지 못했습니다"
            find android/app/build/intermediates -type f -name AndroidManifest.xml | head -20
            exit 1
          fi
          echo "검사: $m"
          found=$(grep -n -E 'FOREGROUND_SERVICE|foregroundServiceType|SYSTEM_ALERT_WINDOW' "$m" | grep -v 'tools:node="remove"' || true)
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::스토어 빌드에 포그라운드 서비스·다른 앱 위 표시가 남아 있습니다 (Play 포그라운드 서비스 신고 전에는 올리면 안 됨)"
            exit 1
          fi
          echo "통과(병합 매니페스트): FOREGROUND_SERVICE · foregroundServiceType · SYSTEM_ALERT_WINDOW 없음"
          # 실제로 올리는 AAB 의 매니페스트도 본다 — AGP 중간 산출물 경로·변환 순서에 기대지 않고, 라이브러리 XML 주석 같은 오탐도 없다
          aab=android/app/build/outputs/bundle/release/app-release.aab
          unzip -l "$aab" base/manifest/AndroidManifest.xml > /dev/null   # AAB 나 매니페스트가 없으면 여기서 실패
          unzip -p "$aab" base/manifest/AndroidManifest.xml > "$RUNNER_TEMP/aab-manifest.pb"
          [ -s "$RUNNER_TEMP/aab-manifest.pb" ] || { echo "::error::AAB 매니페스트를 꺼내지 못했습니다"; exit 1; }
          hits=$(grep -a -o -E 'FOREGROUND_SERVICE[A-Z_]*|foregroundServiceType|SYSTEM_ALERT_WINDOW' "$RUNNER_TEMP/aab-manifest.pb" | sort -u || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::AAB 매니페스트에 포그라운드 서비스·다른 앱 위 표시가 남아 있습니다 (Play 포그라운드 서비스 신고 전에는 올리면 안 됨)"
            exit 1
          fi
          echo "통과(AAB 매니페스트): FOREGROUND_SERVICE · foregroundServiceType · SYSTEM_ALERT_WINDOW 없음"
          echo "- 플로팅 버블: 뺌 · 병합 매니페스트와 AAB 매니페스트에 포그라운드 서비스·SYSTEM_ALERT_WINDOW 없음" >> "$GITHUB_STEP_SUMMARY"
      - name: 서명 확인 (디버그 키로 서명된 AAB 는 스토어에서 거부됨)
        if: env.SIGNING == 'release'
        run: |
          owner=$(keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -m1 -i -E "owner|소유자")
          echo "$owner"
          if echo "$owner" | grep -q "Android Debug"; then echo "::error::AAB 가 디버그 키로 서명됐습니다 (tools/android-signing.mjs 의 주입 실패)"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: mylovecoach-android-${{ env.ANDROID_VERSION_CODE }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
      - name: Play Console 업로드
        if: ${{ inputs.track != '' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "::error::PLAY_SERVICE_ACCOUNT_JSON 시크릿이 없어 업로드를 건너뜁니다"; exit 1; fi
          umask 077; printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-sa.json"
          echo "PLAY_SA_PATH=$RUNNER_TEMP/play-sa.json" >> "$GITHUB_ENV"
      - uses: r0adkll/upload-google-play@v1
        if: ${{ inputs.track != '' }}
        with:
          serviceAccountJson: ${{ env.PLAY_SA_PATH }}
          packageName: app.mylovecoach.android
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed
      - name: 정리
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play-sa.json"
