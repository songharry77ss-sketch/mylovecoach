name: App Store 자동 심사 제출

# 「앱이 수집하는 개인정보」 설문은 API 가 없어 사람이 App Store Connect 화면에서 게시해야 한다.
# 그 뒤에 누가 따로 명령을 내리지 않아도 되도록, 15분마다 제출을 시도한다.
#   · 설문이 아직이면 → 대기 (성공으로 끝나므로 실패 알림 메일이 쌓이지 않는다)
#   · 설문이 게시돼 있으면 → 심사 제출
#   · 이미 심사 중이면 → 아무것도 안 함
#   · 앱스토어에 출시되면 → 이 워크플로를 스스로 끈다 (다음 버전을 멋대로 제출하지 않도록)
# 필요한 시크릿: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: app-store-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: App Store Connect 키 준비
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_P8_BASE64" ]; then echo "::error::시크릿 ASC_KEY_P8_BASE64 가 없습니다"; exit 1; fi
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$RUNNER_TEMP/asc/asc-key.p8"
          printf 'KEY_ID=%s\nISSUER_ID=%s\n' "$ASC_KEY_ID" "$ASC_ISSUER_ID" > "$RUNNER_TEMP/asc/asc-key.txt"

      - name: 심사 제출 시도
        id: submit
        run: node tools/asc-submit.mjs --submit --secrets "$RUNNER_TEMP/asc"

      - name: 결과 요약
        if: always()
        run: |
          case "${{ steps.submit.outputs.state }}" in
            submitted)       head="✅ 심사에 제출했습니다" ;;
            in_review)       head="⏳ 심사 진행 중" ;;
            released)        head="🎉 앱스토어 출시 완료" ;;
            waiting_privacy) head="🙋 개인정보 설문 게시 대기" ;;
            waiting_build)   head="🔧 버전에 빌드 연결 필요" ;;
            blocked)         head="⚠️ 제출이 막혔습니다" ;;
            rejected)        head="❌ 애플 심사 거절 — 사유 확인 필요" ;;
            *)               head="상태 확인" ;;
          esac
          {
            echo "## $head"
            echo
            echo "${{ steps.submit.outputs.message }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 출시가 끝났으면 스스로 끄기
        if: steps.submit.outputs.state == 'released'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable app-store-autosubmit.yml --repo "$GITHUB_REPOSITORY"

      - name: 키 정리
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
