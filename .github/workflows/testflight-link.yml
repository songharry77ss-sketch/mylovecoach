name: TestFlight 공개 초대 링크

# 이메일 등록 없이 링크만 있으면 누구나 설치할 수 있는 TestFlight 초대 링크를 켜고 끈다.
# 켜려면 베타 심사를 통과한 빌드가 외부 그룹에 들어 있어야 한다.
# 필요한 시크릿: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64

on:
  workflow_dispatch:
    inputs:
      action:
        description: '켜기 / 끄기'
        required: true
        default: 'on'
        type: choice
        options: ['on', 'off']
      limit:
        description: '최대 참여 인원 (켤 때만)'
        required: false
        default: '500'
        type: string
      group:
        description: '외부 테스트 그룹 이름'
        required: false
        default: '테스터'
        type: string

permissions:
  contents: read

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: App Store Connect 키 준비
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_P8_BASE64" ]; then echo "::error::시크릿 ASC_KEY_P8_BASE64 가 없습니다"; exit 1; fi
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$RUNNER_TEMP/asc/asc-key.p8"
          printf 'KEY_ID=%s\nISSUER_ID=%s\n' "$ASC_KEY_ID" "$ASC_ISSUER_ID" > "$RUNNER_TEMP/asc/asc-key.txt"

      - name: 링크 설정
        run: |
          set -o pipefail
          if [ "${{ inputs.action }}" = "on" ]; then
            flag=(--public-link "${{ inputs.limit }}")
          else
            flag=(--no-public-link)
          fi
          node tools/asc-testflight.mjs --secrets "$RUNNER_TEMP/asc" --group "${{ inputs.group }}" "${flag[@]}" 2>&1 | tee /tmp/out.txt
          {
            echo "## TestFlight 공개 초대 링크"
            echo '```'
            cat /tmp/out.txt
            echo '```'
            url=$(grep -oE 'https://testflight\.apple\.com/join/[A-Za-z0-9]+' /tmp/out.txt | tail -1 || true)
            [ -n "$url" ] && echo "**테스터에게 줄 링크: $url**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 키 정리
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
