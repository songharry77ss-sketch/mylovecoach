name: 전체 상태 확인

# 휴대폰에서 「지금 어디까지 됐지?」를 한 번에 보는 용도. 아무것도 바꾸지 않는다.
# 웹·Play·App Store/TestFlight 상태와 테스터에게 줄 링크를 한 화면에 모아 준다.
# 필요한 시크릿: PLAY_SERVICE_ACCOUNT_JSON, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 웹 · 코치 서버
        run: |
          {
            echo "## 웹"
            base="${API_URL:-https://mylovecoach.vercel.app}"
            for p in "" /privacy.html /terms.html /admin.html; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$base$p" || echo 000)
              echo "- \`$base$p\` → $code"
            done
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' "$base/api/coach" || echo 000)
            echo "- \`$base/api/coach\` (토큰 없이) → $code · 401 이면 정상 보호"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 안드로이드 직접 설치용 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 안드로이드 (플레이스토어 없이 바로 설치)"
            tag=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
            if [ -n "$tag" ]; then
              name=$(gh release view "$tag" --json assets -q '.assets[0].name')
              echo "- 최신 릴리스: \`$tag\`"
              echo "- 설치 주소: https://github.com/$GITHUB_REPOSITORY/releases/latest"
              echo "- 파일: $name"
            else
              echo "- 릴리스 없음 — \`android-apk.yml\` 을 실행하세요"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Play Console
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          { echo "## Play Console"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          node tools/play-status.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || echo "(조회 실패)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: App Store Connect 키 준비
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$RUNNER_TEMP/asc/asc-key.p8"
          printf 'KEY_ID=%s\nISSUER_ID=%s\n' "$ASC_KEY_ID" "$ASC_ISSUER_ID" > "$RUNNER_TEMP/asc/asc-key.txt"

      - name: App Store · TestFlight
        run: |
          { echo "## 아이폰 (TestFlight)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          node tools/asc-status.mjs --secrets "$RUNNER_TEMP/asc" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || echo "(조회 실패)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 키 정리
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
