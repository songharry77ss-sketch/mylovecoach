name: 인스타 게시물 자동 생산

# 매주 토요일, 콘텐츠 창고(social-queue 가지 marketing/content/bank.json)에서 앞으로 8일치가 차도록 골라
# 그림·영상을 만들고 게시 큐(queue.json)에 approved:false 로 넣는다. 그리고 미리 보기 이슈를 열어 알린다.
# 무엇을 고를지는 지난 성과로 배운 것(social-queue 가지 marketing/learn/ — 매일 「인스타·쓰레드 성과」가 쌓음)을 따른다.
# 사람이 미리 보기 이슈에 「허락」 댓글을 달면 하루 하나씩 올라간다. 흐름: docs/SOCIAL_AUTOPOST.md 「자동 생산」·「스스로 배우기」
# 손으로 돌릴 때: 「Run workflow」 → 며칠 뒤까지 · 연습(만들기만 하고 큐에 안 넣음)

on:
  schedule:
    - cron: '17 1 * * 6' # 토 10:17 KST (예약은 몇 시간 밀릴 수 있음 — 그래도 같은 날 안에 돎)
  workflow_dispatch:
    inputs:
      ahead:
        description: '오늘부터 며칠 뒤까지 채울지 (하루 하나, 이미 찬 날은 건너뜀)'
        required: false
        default: '8'
      dry_run:
        description: '연습 — 만들기만 하고 큐에 넣지 않음 (결과는 실행 기록의 Artifacts 에)'
        type: boolean
        default: false
      id:
        description: '하나만 만들어 보기 — 창고 항목 id (큐는 그대로, 결과는 Artifacts 에)'
        required: false
        default: ''
      bank:
        description: '하나만 만들 때 쓸 창고 파일 (비우면 social-queue 의 창고)'
        required: false
        default: ''

permissions:
  contents: write # social-queue 가지에 그림·큐를 넣는다
  issues: write # 미리 보기 이슈

concurrency:
  group: social-queue-write
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: social-queue
          path: queue
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 준비 (패키지 · ffmpeg)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          # app-reel 녹화용 브라우저 조종(설치된 Google Chrome 사용) · 답장 속 이모지 글꼴
          npm i --no-save --no-audit --no-fund playwright-core@1.48.2 && { fc-list | grep -qi 'Noto Color Emoji' || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji) || echo '::warning::이모지 글꼴을 못 깔았어요 — app-reel 답장 속 이모지가 네모로 나올 수 있어요'; }
          # 우분투에는 한글 글꼴이 없어 앱 화면 글자가 네모(□)로 나온다 (2026-11-17 첫 CI 녹화) — 저장소의 Pretendard 를 시스템 글꼴로 깔고 기본 글꼴로
          mkdir -p ~/.local/share/fonts ~/.config/fontconfig
          cp scripts/assets/fonts/Pretendard-*.otf api/_assets/fonts/Pretendard-*.otf ~/.local/share/fonts/
          printf '%s\n' '<?xml version="1.0"?>' '<!DOCTYPE fontconfig SYSTEM "fonts.dtd">' '<fontconfig>' \
            '<alias><family>sans-serif</family><prefer><family>Pretendard</family></prefer></alias>' \
            '<alias><family>system-ui</family><prefer><family>Pretendard</family></prefer></alias>' '</fontconfig>' > ~/.config/fontconfig/fonts.conf
          fc-cache -f > /dev/null
          echo "기본 글꼴: $(fc-match sans-serif) · 한글: $(fc-match 'sans-serif:lang=ko')"
          fc-match 'sans-serif:lang=ko' | grep -q Pretendard || { echo '::error::한글 글꼴(Pretendard)이 안 깔렸어요'; exit 1; }

      - name: 창고 검사
        run: node tools/social-make/make.mjs --bank queue/marketing/content/bank.json --check

      - name: 하나만 만들어 보기
        if: inputs.id != ''
        env:
          ID: ${{ inputs.id }}
          BANK: ${{ inputs.bank || 'queue/marketing/content/bank.json' }}
          # app-reel(실제 앱 사용 영상)이 진짜 AI 결과를 받을 코치 서버 — 데모 웹 빌드에는 들어가지 않는다
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_API_TOKEN: ${{ secrets.EXPO_PUBLIC_API_TOKEN }}
          # 릴스 목소리·특수 효과음(일레븐랩스) — 키가 없으면 그 소리만 빼고 만든다 (tools/social-make/sound.mjs)
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_F: ${{ vars.ELEVENLABS_VOICE_F }}
          ELEVENLABS_VOICE_M: ${{ vars.ELEVENLABS_VOICE_M }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
        run: node tools/social-make/make.mjs --bank "$BANK" --id "$ID" --out one

      - name: 하나 만든 결과
        if: inputs.id != ''
        uses: actions/upload-artifact@v4
        with:
          name: one
          path: one/
          retention-days: 7

      - name: 만들어 큐에 넣기
        if: inputs.id == ''
        env:
          AHEAD: ${{ inputs.ahead || '8' }}
          AUTO_APPROVE: ${{ vars.SOCIAL_AUTO_APPROVE }}
          # app-reel(실제 앱 사용 영상)이 진짜 AI 결과를 받을 코치 서버 — 데모 웹 빌드에는 들어가지 않는다
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_API_TOKEN: ${{ secrets.EXPO_PUBLIC_API_TOKEN }}
          # 릴스 목소리·특수 효과음(일레븐랩스) — 키가 없으면 그 소리만 빼고 만든다 (tools/social-make/sound.mjs)
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_F: ${{ vars.ELEVENLABS_VOICE_F }}
          ELEVENLABS_VOICE_M: ${{ vars.ELEVENLABS_VOICE_M }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
        run: |
          # 오늘부터 AHEAD 일 뒤까지 차도록만 넣는다 — 손으로 돌린 다음 날 정기 실행이 돌아도 겹치지 않음
          # 저장소 변수 SOCIAL_AUTO_APPROVE=on 이면 허락된 채로 넣는다 (사장님이 켜고 끄는 스위치)
          node tools/social-make/make.mjs --bank queue/marketing/content/bank.json \
            --queue queue/marketing/social/queue.json --root queue --fill --ahead "$AHEAD" --days 14 --summary made.json \
            $([ "$AUTO_APPROVE" = on ] && echo --approve)
          node tools/social-post.mjs --queue queue/marketing/social/queue.json --check

      - name: 연습이면 결과만 남김
        if: inputs.dry_run && inputs.id == ''
        uses: actions/upload-artifact@v4
        with:
          name: made
          path: |
            made.json
            queue/marketing/social/*/
          retention-days: 7

      - name: social-queue 에 넣기
        id: push
        if: ${{ !inputs.dry_run && inputs.id == '' }}
        run: |
          cd queue
          if [ -z "$(git status --porcelain)" ]; then echo '새로 넣을 게 없음'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marketing/social
          git commit -m "자동 생산 $(date -u +%F): $(node -e "console.log(require('../made.json').added.map(e=>e.id).join(', '))")"
          # 그사이 게시 기록(posted.json)·허락이 들어왔을 수 있다
          git pull -q --rebase origin social-queue
          git push origin HEAD:social-queue
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 미리 보기 이슈
        if: ${{ steps.push.outputs.ref != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.push.outputs.ref }}
        run: |
          node tools/social-make/preview.mjs made.json "$REF" > preview.md
          cat preview.md >> "$GITHUB_STEP_SUMMARY"
          gh issue create --title "이번 주 인스타 게시물 미리 보기 ($(date -u +%m-%d))" --body-file preview.md
