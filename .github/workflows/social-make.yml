name: 인스타 게시물 자동 생산

# 매주 토요일, 콘텐츠 창고(social-queue 가지 marketing/content/bank.json)에서 앞으로 8일치가 차도록 골라
# 그림·영상을 만들고 게시 큐(queue.json)에 approved:false 로 넣는다. 그리고 미리 보기 이슈를 열어 알린다.
# 사람이 보고 「인스타·쓰레드 게시 허락」(all)을 누르면 하루 하나씩 올라간다. 흐름: docs/SOCIAL_AUTOPOST.md 「자동 생산」
# 손으로 돌릴 때: 「Run workflow」 → 며칠 뒤까지 · 연습(만들기만 하고 큐에 안 넣음)

on:
  schedule:
    - cron: '17 1 * * 6' # 토 10:17 KST (예약은 몇 시간 밀릴 수 있음 — 그래도 같은 날 안에 돎)
  workflow_dispatch:
    inputs:
      ahead:
        description: '오늘부터 며칠 뒤까지 채울지 (하루 하나, 이미 찬 날은 건너뜀)'
        required: false
        default: '8'
      dry_run:
        description: '연습 — 만들기만 하고 큐에 넣지 않음 (결과는 실행 기록의 Artifacts 에)'
        type: boolean
        default: false

permissions:
  contents: write # social-queue 가지에 그림·큐를 넣는다
  issues: write # 미리 보기 이슈

concurrency:
  group: social-queue-write
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: social-queue
          path: queue
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 준비 (패키지 · ffmpeg)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: 창고 검사
        run: node tools/social-make/make.mjs --bank queue/marketing/content/bank.json --check

      - name: 만들어 큐에 넣기
        env:
          AHEAD: ${{ inputs.ahead || '8' }}
        run: |
          # 오늘부터 AHEAD 일 뒤까지 차도록만 넣는다 — 손으로 돌린 다음 날 정기 실행이 돌아도 겹치지 않음
          node tools/social-make/make.mjs --bank queue/marketing/content/bank.json \
            --queue queue/marketing/social/queue.json --root queue --fill --ahead "$AHEAD" --days 14 --summary made.json
          node tools/social-post.mjs --queue queue/marketing/social/queue.json --check

      - name: 연습이면 결과만 남김
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: made
          path: |
            made.json
            queue/marketing/social/*/
          retention-days: 7

      - name: social-queue 에 넣기
        id: push
        if: ${{ !inputs.dry_run }}
        run: |
          cd queue
          if [ -z "$(git status --porcelain)" ]; then echo '새로 넣을 게 없음'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marketing/social
          git commit -m "자동 생산 $(date -u +%F): $(node -e "console.log(require('../made.json').added.map(e=>e.id).join(', '))")"
          # 그사이 게시 기록(posted.json)·허락이 들어왔을 수 있다
          git pull -q --rebase origin social-queue
          git push origin HEAD:social-queue
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 미리 보기 이슈
        if: ${{ steps.push.outputs.ref != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.push.outputs.ref }}
        run: |
          node tools/social-make/preview.mjs made.json "$REF" > preview.md
          cat preview.md >> "$GITHUB_STEP_SUMMARY"
          gh issue create --title "이번 주 인스타 게시물 미리 보기 ($(date -u +%m-%d))" --body-file preview.md
