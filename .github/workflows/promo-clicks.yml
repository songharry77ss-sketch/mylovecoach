name: 홍보 링크 클릭 쌓기

# 커뮤니티·채널마다 나눠 준 추적 링크(/go/코드)의 클릭 수와, 그 링크로 들어와 앱을 연 사람 수를
# 서버(/api/go-stats — 7일만 보관)에서 읽어 social-queue 가지 marketing/promo/clicks.json 에 오래 쌓는다.
# 추적판(아티팩트)이 이 파일과 /api/go-stats 를 함께 읽는다. 흐름: docs/PROMO_TRACKING.md

on:
  schedule:
    - cron: '30 15 * * *' # 00:30 KST — 전날 숫자를 거의 다 담는다
    - cron: '0 6 * * *' # 15:00 KST
  workflow_dispatch:

permissions:
  contents: write # social-queue 가지에 marketing/promo/ 만 쓴다

concurrency:
  group: social-queue-write
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: social-queue
          path: queue
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 클릭 숫자 읽어 합치기
        run: node tools/promo-snapshot.mjs --root queue

      - name: 저장
        run: |
          cd queue
          if [ -z "$(git status --porcelain marketing/promo)" ]; then echo '바뀐 것 없음'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marketing/promo
          git commit -qm "홍보 링크 클릭 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git pull -q --rebase origin social-queue && git push -q origin HEAD:social-queue && exit 0; sleep 5; done
          exit 1
