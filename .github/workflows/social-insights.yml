name: 인스타·쓰레드 성과

# 매일 10:00 KST 에 최근 게시물의 조회·도달·저장·공유·좋아요·댓글을 요약에 표로 남긴다 (인스타에는 읽기만).
# 같은 숫자를 social-queue 가지 marketing/learn/ 에 쌓고, 포맷·주제별 점수를 다시 배운다(tools/social-learn.mjs).
# 토요일 자동 생산(social-make.yml)이 이 배운 것으로 다음 주 구성을 정한다 — 흐름: docs/SOCIAL_AUTOPOST.md 「스스로 배우기」
# 매주 월요일에는 장기 토큰(60일)도 연장한다. 새 토큰이 나오면 SOCIAL_SECRETS_PAT(저장소 시크릿 쓰기 권한)가 있을 때만 시크릿을 바꾸고,
# 없으면 요약에 「시크릿을 새로 넣어 주세요」를 남긴다. 흐름: docs/SOCIAL_AUTOPOST.md

on:
  schedule:
    - cron: '0 1 * * *' # 10:00 KST
  workflow_dispatch:

permissions:
  contents: write # social-queue 가지에 성과 기록(marketing/learn/)만 쓴다

concurrency:
  group: social-queue-write
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      IG_API: ${{ vars.IG_API }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
      SOCIAL_EXPECT_IG: my.lovecoach
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: social-queue
          path: queue
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 성과 표
        run: node tools/social-insights.mjs --limit 12

      - name: 성과 쌓기 · 배우기
        run: node tools/social-learn.mjs --root queue --limit 40

      - name: 다 올린 그림·영상 정리
        # 가지가 커지면 jsDelivr 가 그림을 못 가져온다 — 다 올리고 하루 지난 항목 폴더만 뺀다 (git 기록엔 남음)
        run: node tools/social-make/prune.mjs --root queue --days 1

      - name: 성과 기록 저장
        run: |
          cd queue
          if [ -z "$(git status --porcelain marketing/learn marketing/social)" ]; then echo '바뀐 것 없음'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A marketing/learn marketing/social
          git commit -qm "성과 기록 · 다 올린 그림 정리 $(TZ=Asia/Seoul date +%F)"
          # 그사이 게시 기록·허락이 들어왔을 수 있다 (자동 게시는 다른 줄을 써서 겹치지 않음)
          for i in 1 2 3; do git pull -q --rebase origin social-queue && git push -q origin HEAD:social-queue && exit 0; sleep 5; done
          exit 1

      - name: 토큰 연장 (월요일 · 손으로 돌릴 때)
        env:
          GH_TOKEN: ${{ secrets.SOCIAL_SECRETS_PAT }}
        run: |
          if [ "$(TZ=Asia/Seoul date +%u)" != "1" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then echo "월요일이 아니라 건너뜀"; exit 0; fi
          echo "## 토큰" >> "$GITHUB_STEP_SUMMARY"
          for ch in instagram threads; do
            f=$(mktemp)
            node tools/social-token.mjs "$ch" "$f" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -s "$f" ]; then
              name=$([ "$ch" = instagram ] && echo IG_ACCESS_TOKEN || echo THREADS_ACCESS_TOKEN)
              current=$([ "$ch" = instagram ] && echo "$IG_ACCESS_TOKEN" || echo "$THREADS_ACCESS_TOKEN")
              if [ "$(cat "$f")" != "$current" ]; then
                if [ -n "$GH_TOKEN" ]; then gh secret set "$name" --repo "$GITHUB_REPOSITORY" < "$f" && echo "- $name 시크릿 갱신" >> "$GITHUB_STEP_SUMMARY";
                else echo "- ⚠️ $name: 새 토큰이 나왔지만 SOCIAL_SECRETS_PAT 가 없어 저장 못 함 — 메타 개발자 화면에서 새로 발급해 시크릿에 넣어 주세요" >> "$GITHUB_STEP_SUMMARY"; fi
              fi
            fi
            rm -f "$f"
          done
