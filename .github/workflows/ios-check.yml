name: iOS Compile Check

# 서명 없이 시뮬레이터용으로 컴파일만 해 본다 (Xcode·CocoaPods·Expo 툴체인 검증). 시크릿 불필요.
# Expo SDK 57 은 최신 Xcode 를 전제로 하므로 러너 이미지/Xcode 조합을 매트릭스로 검증한다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: '26.6'
          - runner: macos-27
            xcode: '27'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      XCODE_PREFER: ${{ matrix.xcode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: bash tools/select-xcode.sh
      - run: npm ci
      - name: expo prebuild + pod install
        run: |
          npx expo prebuild --platform ios --no-install
          cd ios && pod install --repo-update
      - name: 시뮬레이터 컴파일 (서명 없음)
        run: |
          mkdir -p build/logs
          set -o pipefail
          xcodebuild -workspace ios/app.xcworkspace -scheme app -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build/logs/compile.log | tail -40
      - name: 실패 원인 추출
        if: failure()
        run: |
          echo "===== error 줄 ====="
          grep -n -E "error:|\[ExpoModulesJSI\]|Sandbox|denied|No such file" build/logs/compile.log | grep -v "warning:" | grep -v "TEMP_SANDBOX\|/usr/bin/clang" | tail -60 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-compile-failure-${{ matrix.runner }}-${{ github.run_id }}
          path: build/logs/
          retention-days: 7
