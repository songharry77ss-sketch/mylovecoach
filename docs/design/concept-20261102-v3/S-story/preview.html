<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>찐텐 · 화면 둘러보기</title><link rel="stylesheet" href="style.css"><style>body{height:100vh;overflow:hidden;background:#141414}.viewer-head{height:112px;max-width:1280px;padding:24px 36px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:24px}.viewer-brand{font-size:30px;font-weight:700;color:#ff3d8b;white-space:nowrap}.viewer-tabs{display:flex;gap:8px;align-items:center}.viewer-tabs button,.viewer-tabs a{display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;font-size:16px;border-radius:30px;background:#292929;color:#fff1dc}.viewer-tabs button.active{color:#0a0a0a;background:#ff3d8b}.viewport{height:calc(100vh - 160px);display:flex;justify-content:center;align-items:center}.phone-preview{position:relative;border:3px solid #4b4b4b;border-radius:42px;overflow:hidden;background:#0a0a0a;box-sizing:content-box;flex-shrink:0}iframe{width:1179px;height:2556px;border:0;transform-origin:0 0;position:absolute;top:0;left:0}.viewer-note{font-size:13px;text-align:center;color:#b7b4b1;margin-top:14px}@media(max-width:680px){.viewer-head{height:100px;padding:12px 16px;flex-wrap:wrap;gap:8px}.viewer-brand{font-size:24px}.viewer-tabs button,.viewer-tabs a{font-size:13px;padding:0 12px;min-height:36px}.viewer-tabs a{display:none}.viewport{height:calc(100vh - 150px)}}
</style></head><body><header class="viewer-head"><div class="viewer-brand">찐텐</div><nav class="viewer-tabs"><button class="active" data-src="screen-1-home.html">홈</button><button data-src="screen-2-result.html?step=1">코칭 이야기</button><button data-src="screen-3-kkti.html">내 연애 유형</button><a href="board.png" target="_blank">브랜드 보드 ↗</a></nav></header><div class="viewport"><div class="phone-preview"><iframe title="찐텐 화면 시안" src="screen-1-home.html"></iframe></div></div><p class="viewer-note">정해진 예시 대화로 둘러보는 시안이에요. 버튼을 눌러 이야기를 넘겨보세요.</p><script>const frame=document.querySelector('iframe'),phone=document.querySelector('.phone-preview');function fit(){const area=document.querySelector('.viewport');const scale=Math.min((area.clientHeight-8)/2556,(innerWidth-32)/1179,0.39);frame.style.transform='scale('+scale+')';phone.style.width=(1179*scale)+'px';phone.style.height=(2556*scale)+'px'}addEventListener('resize',fit);fit();document.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{frame.src=b.dataset.src;document.querySelectorAll('[data-src]').forEach(x=>x.classList.toggle('active',x===b))});</script></body></html>
